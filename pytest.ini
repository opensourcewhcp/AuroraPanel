[pytest]
testpaths = tests
addopts = -ra --cov=backend --cov-report=term-missing:skip-covered --cov-report=html:htmlcov --cov-fail-under=35
# --cov-fail-under is a ratchet: the full suite fails if total coverage drops below it, so a release
# can't regress coverage. Raise it as coverage grows. For a quick subset run, add --no-cov.
# Calibrated to the GitHub CI container (~36.4% after the security-path tests of 1.1.31; 35 leaves a margin), which is the canonical environment. A Pi/root run with
# real tools (docker, systemd) exercises a few more branches and reports higher; don't tune this to that.
markers =
    real_local_txt: use the real dmarc._local_txt (faked as down by default)
filterwarnings =
    ignore::DeprecationWarning
